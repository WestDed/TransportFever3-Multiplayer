name: Offline tests
on:
  pull_request:
  push:
    branches: ['main']
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  lua-and-fixtures:
    name: Lua and lockstep (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tests/requirements-offline.txt
      - name: All discovered regression tests (including the complete original lockstep scenarios)
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Complete translation report (no allowed gaps)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit-results
          python tests/test_lang_baseline.py --report > audit-results/lang.txt 2>&1
          cat audit-results/lang.txt
          echo "All translations checked: no allowed gaps or broken placeholders." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: translation-report-${{ matrix.os }}
          path: audit-results/
  launcher-decoder:
    name: C# launcher decoder
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Compile and exercise the actual LuaLit from Core.cs (no game)
        shell: pwsh
        run: ./tests/test_lualit.ps1
  network-components:
    name: Real TCP and file components (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet run --project tests/offline/Offline.csproj --configuration Release
      - name: Generated 32 MiB snapshot through real TCP for 1, 4 and 8 peers (no game)
        run: dotnet run --project tests/offline/Offline.csproj --configuration Release -- --bench
      - uses: actions/upload-artifact@v4
        with:
          name: tcp-load-${{ matrix.os }}
          path: audit-results/tcp-load.json
          if-no-files-found: error
  framework-components:
    name: Actual .NET Framework 4.8 TCP, ownership and file tests (no game)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compile net48 tests and execute them on the Windows Framework runtime
        shell: pwsh
        run: |
          dotnet build tests/offline/Offline48.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./tests/offline/bin48/net48/Offline48.exe
          exit $LASTEXITCODE
  windows-build:
    name: Full Windows EXE and native DLL build (no game)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build existing net48 launcher, freestanding DLL and package
        shell: cmd
        run: build.bat
      - name: Run production native company UI filter on Windows (no game hooks)
        shell: pwsh
        run: ./tests/test_native_privacy.ps1
      - name: Verify x64 binaries, package and preserved license
        shell: pwsh
        run: ./tests/verify_windows_build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: experimental-windows-build-not-game-tested
          path: |
            release/*.zip
            release/build-manifest.json
            release/native-exports.txt
          if-no-files-found: error
