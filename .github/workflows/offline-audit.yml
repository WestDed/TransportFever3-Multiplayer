name: Offline component audit
on:
  pull_request:
  push:
    branches: ['audit/**']
permissions:
  contents: read
jobs:
  pure-lua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tests/requirements-offline.txt
      - name: Pure Lua components (known defects reported as expected failures)
        run: python tests/test_companies_offline.py
      - name: Upstream baseline (report failures without hiding them)
        shell: bash
        run: |
          mkdir -p audit-results
          set +e
          python tests/test_lang.py > audit-results/lang.txt 2>&1
          lang_rc=$?
          python tests/test_lockstep.py > audit-results/lockstep.txt 2>&1
          lockstep_rc=$?
          echo "test_lang.py exit=$lang_rc" >> "$GITHUB_STEP_SUMMARY"
          echo "test_lockstep.py exit=$lockstep_rc" >> "$GITHUB_STEP_SUMMARY"
          cat audit-results/lang.txt audit-results/lockstep.txt
      - uses: actions/upload-artifact@v4
        with:
          name: upstream-baseline
          path: audit-results/
