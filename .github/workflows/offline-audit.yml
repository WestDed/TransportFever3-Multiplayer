name: Offline tests
on:
  pull_request:
  push:
    branches: ['main', 'audit/**', 'fix/**']
permissions:
  contents: read
jobs:
  lua-and-fixtures:
    name: Lua and lockstep (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tests/requirements-offline.txt
      - name: All discovered regression tests (including the complete original lockstep scenarios)
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Known translation debt report (strict allowance checked by tests)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit-results
          python tests/test_lang_baseline.py --report > audit-results/lang.txt 2>&1
          cat audit-results/lang.txt
          echo "Three audited translation gaps remain; test_lang_baseline.py rejects new gaps or broken placeholders." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: translation-report-${{ matrix.os }}
          path: audit-results/
  launcher-decoder:
    name: C# launcher decoder
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Compile and exercise the actual LuaLit from Core.cs (no game)
        shell: pwsh
        run: ./tests/test_lualit.ps1
  network-components:
    name: Real TCP and file components (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet run --project tests/offline/Offline.csproj --configuration Release
  windows-build:
    name: Full Windows EXE and native DLL build (no game)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build existing net48 launcher, freestanding DLL and package
        shell: cmd
        run: build.bat
      - uses: actions/upload-artifact@v4
        with:
          name: experimental-windows-build-not-game-tested
          path: release/*.zip
          if-no-files-found: error
